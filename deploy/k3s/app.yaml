apiVersion: v1
kind: Namespace
metadata:
  name: pony-sentry
---
# -------------------------------------------------------------
# 1. 宿主机代理 Service & Endpoints（将 Ingress 流量转送宿主机原生端口 3000）
# -------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: pony-sentry
  namespace: pony-sentry
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: pony-sentry
  namespace: pony-sentry
subsets:
  - addresses:
      - ip: 100.95.193.103
    ports:
      - name: http
        port: 3000
---
# -------------------------------------------------------------
# 2. 安全中间件：强制 HTTPS 重定向 + 公网限流 + 请求体缓冲限制
# -------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: pony-sentry
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ingest-ratelimit
  namespace: pony-sentry
spec:
  rateLimit:
    average: 100
    burst: 200
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ingest-buffering
  namespace: pony-sentry
spec:
  buffering:
    maxRequestBodyBytes: 524288
    memRequestBodyBytes: 65536
---
# -------------------------------------------------------------
# 3. 生产公网 Ingress（仅暴露 /api/v1/ingest 与 /healthz）
# -------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pony-sentry-public-ingest
  namespace: pony-sentry
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      pony-sentry-redirect-https@kubernetescrd,
      pony-sentry-ingest-ratelimit@kubernetescrd,
      pony-sentry-ingest-buffering@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - sentry.ponyjob.top
      secretName: sentry-ponyjob-top-tls
  rules:
    - host: sentry.ponyjob.top
      http:
        paths:
          - path: /api/v1/ingest
            pathType: Exact
            backend:
              service:
                name: pony-sentry
                port:
                  number: 3000
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: pony-sentry
                port:
                  number: 3000
---
# -------------------------------------------------------------
# 4. Tailscale 私网控制台（Web UI & Dashboard）
# -------------------------------------------------------------
# 不暴露公网域名/Ingress：仅限 Tailscale 内网 MagicDNS 访问宿主机服务：
#   http://devserver.taildb165c.ts.net:3000
# 根路径与控制台页面对外网返回 HTTP 404，天然杜绝泄露风险。
