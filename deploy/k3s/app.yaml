apiVersion: v1
kind: Namespace
metadata:
  name: pony-sentry
---
# -------------------------------------------------------------
# 1. 宿主机代理 Service & Endpoints（将 Ingress 流量转送宿主机原生端口 3000）
# -------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: pony-sentry
  namespace: pony-sentry
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: pony-sentry
  namespace: pony-sentry
subsets:
  - addresses:
      - ip: 100.95.193.103
    ports:
      - name: http
        port: 3000
---
# -------------------------------------------------------------
# 2. 安全中间件：强制 HTTPS 重定向 + 公网限流 + 请求体缓冲限制
# -------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: pony-sentry
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ingest-ratelimit
  namespace: pony-sentry
spec:
  rateLimit:
    average: 100
    burst: 200
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ingest-buffering
  namespace: pony-sentry
spec:
  buffering:
    maxRequestBodyBytes: 524288
    memRequestBodyBytes: 65536
---
# -------------------------------------------------------------
# 3. 生产公网 Ingress（仅暴露 /api/v1/ingest 与 /healthz）
#    暴露面收敛（契约 R10.2 / R10.3）：/api/v1/traces 与全部读接口只走集群内 svc 或 tailnet，
#    公网访问必须返回 404。新增公网路径前先过安全评审。
#    【硬约束】管理路由不得加公网 Ingress：
#      /api/v1/issues、/api/v1/issues/:id、/api/v1/issues/:id/events、/api/v1/projects、
#      /api/v1/traces、/api/v1/traces/:id、/api/v1/auth/session 一律保持集群内 / tailnet 可达。
#      开启 CONSOLE_TAILNET_TRUST 后，可信 tailnet 对端对这些读接口免 admin token
#      （见 .dev-team/contract-tailnet-trust.md）；一旦挂到公网 Ingress，等于把「免 token 读」
#      交给外网来源（Host 白名单只挡 DNS rebinding，不构成公网鉴权）。
# -------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pony-sentry-public-ingest
  namespace: pony-sentry
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      pony-sentry-redirect-https@kubernetescrd,
      pony-sentry-ingest-ratelimit@kubernetescrd,
      pony-sentry-ingest-buffering@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - sentry.ponyjob.top
      secretName: sentry-ponyjob-top-tls
  rules:
    - host: sentry.ponyjob.top
      http:
        paths:
          - path: /api/v1/ingest
            pathType: Exact
            backend:
              service:
                name: pony-sentry
                port:
                  number: 3000
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: pony-sentry
                port:
                  number: 3000
---
# -------------------------------------------------------------
# 4. Tailscale 私网控制台（Web UI & Dashboard）
# -------------------------------------------------------------
# 不暴露公网域名/Ingress：仅限 Tailscale 内网 MagicDNS 访问宿主机服务：
#   http://devserver.taildb165c.ts.net:3000
# 根路径与控制台页面对外网返回 HTTP 404，天然杜绝泄露风险。
#
# 【控制台仅 tailnet】控制台（/ 与全部管理读接口）的唯一入口是 tailnet MagicDNS 直连。
#   不要为控制台创建公网 Ingress / NodePort / 公网 LB；也不要把它挂到上面的 sentry.ponyjob.top。
#   如需启用 CONSOLE_TAILNET_TRUST，Host 白名单必须填 tailnet 侧的真实 Host
#   （例如 devserver.taildb165c.ts.net），因为 Host 白名单是 DNS rebinding 的唯一防线。
#   经反代/隧道（nginx、ssh -L、kubectl port-forward）访问会引入代理头或改写 Host，
#   服务端按 fail-closed 拒绝信任，此时仍用 ADMIN_TOKEN 登录。
