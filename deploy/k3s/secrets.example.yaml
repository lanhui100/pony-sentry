# deploy/k3s/secrets.example.yaml
# 注意：本文件为脱敏模板！真实的密钥通过 CI/CD 或 k3s 命令行外部安全注入，严禁提交到代码仓库。
apiVersion: v1
kind: Secret
metadata:
  name: pony-sentry-secrets
  namespace: pony-sentry
type: Opaque
stringData:
  DATABASE_URL: "postgresql://job_copilot:YOUR_PASSWORD_HERE@job-copilot-postgres.dev.svc.cluster.local:5432/ponysentry"
  # 可选：客户端上报鉴权 Token。配置后公网 Ingest 将强制校验
  # X-Client-Token 或 Authorization: Bearer <token> 请求头，未授权请求返回 401。
  CLIENT_TOKEN: "GENERATE_A_STRONG_RANDOM_TOKEN_HERE"
