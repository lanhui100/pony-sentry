name: CI & Secure Delivery Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # Tier 3 Gate: 自动化 CI 严苛门禁
  # -------------------------------------------------------------
  tier3-gates:
    name: Code Hygiene, Security Scan & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format & Lint Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace -- -D warnings

      - name: Secret Leak Prevention Scan
        run: |
          # 机械检测仓库内是否存在硬编码凭证
          git grep -EI "password\s*[:=]\s*['\"][^'\"]{8,}['\"]|PRIVATE KEY" -- ':!*.example.*' ':!*tests*' || true

      - name: Run Test Suite
        run: cargo test --workspace --verbose

  # -------------------------------------------------------------
  # 交付验证作业：宿主机二进制编译构建与安装包完整性
  # -------------------------------------------------------------
  package-validation:
    name: Build & Package Validation
    needs: tier3-gates
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Build Web Frontend
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release -p pony-sentry-server

      - name: Check Binary Output
        run: |
          test -f target/release/pony-sentry-server
          chmod +x target/release/pony-sentry-server
