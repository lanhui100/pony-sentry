[workspace]

[package]
name = "pony-sentry-contract-tests"
version = "0.1.0"
edition = "2021"
publish = false

# 该包是「契约级黑盒验收测试」专用包，故意不加入上层 workspace：
# - `crates/**` 是实施者写域，Test Agent 禁写；
# - 本包不依赖任何 crate 内部类型，只通过进程级契约面（env + HTTP）驱动被测二进制，
#   因此红相失败必然是「能力缺失」而非编译/类型不匹配。
# 运行：cargo test --manifest-path tests/Cargo.toml --offline
autotests = false
autobins = false
autoexamples = false
autobenches = false

[[test]]
name = "api_ingest_v1_contract"
path = "api_ingest_v1_contract.rs"

[[test]]
name = "api_admin_auth_contract"
path = "api_admin_auth_contract.rs"

# 契约：.dev-team/contract-tailnet-trust.md（FROZEN ver 2，R-T1..R-T13）
[[test]]
name = "api_tailnet_trust_contract"
path = "api_tailnet_trust_contract.rs"

# 契约：.dev-team/trace-fix-contract.md（FROZEN v1，§C9 C9.1–C9.10）
[[test]]
name = "acceptance_trace_v2"
path = "acceptance_trace_v2.rs"

# 契约：.dev-team/trace-fix-contract.md amend v1.5（M-04/W-05/I-01/I-02/I-07/W-04/I-04/I-06/I-09/M-03）
[[test]]
name = "acceptance_trace_v2_ext"
path = "acceptance_trace_v2_ext.rs"

# 契约：.dev-team/trace-fix-contract.md amend v1.6（负向/对抗语义 8 条）
[[test]]
